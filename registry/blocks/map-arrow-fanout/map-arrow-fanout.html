    <style>
      :root {
        --maf-west: #703030;
        --maf-west-deep: #603030;
        --maf-land: #c8bca8;
        --maf-land-alt: #b0a494;
        --maf-sea: #1a1a28;
        --maf-bg: #2a2420;
        --maf-outer-tan: #c4a882;
        --maf-sector-fr: #8e94a3;
        --maf-sector-uk: #d6d2c9;
        --maf-sector-us: #bda876;
        --maf-sector-su: #703030;
        --maf-circle: #703030;
        --maf-arrow: #ffffff;
        --maf-label: #ffffff;
        --maf-border: #1a1210;
        --maf-credit: rgba(232, 220, 196, 0.45);
      }
      *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
      body { background: #0e0c0b; overflow: hidden; }
      #root-map-arrow-fanout {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--maf-bg);
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      }
      #maf-stage {
        position: absolute;
        inset: 0;
        overflow: hidden;
        background: var(--maf-bg);
      }
      #maf-camera {
        position: absolute;
        left: 0; top: 0;
        width: 1920px; height: 1080px;
        transform-origin: 1038px 482px; /* Berlin measured pin */
        will-change: transform;
      }
      #maf-svg { position: absolute; inset: 0; width: 100%; height: 100%; }
      #maf-berlin-layer {
        position: absolute; inset: 0;
        opacity: 0;
        pointer-events: none;
      }
      #maf-berlin-svg { position: absolute; inset: 0; width: 100%; height: 100%; }
      #maf-endcard {
        position: absolute; inset: 0;
        opacity: 0;
        pointer-events: none;
        background: linear-gradient(180deg, #4a4a6a 0%, #2a2a40 45%, #1a1828 100%);
      }
      #maf-endcard-svg { position: absolute; inset: 0; width: 100%; height: 100%; }
      #maf-grain {
        position: absolute; inset: 0;
        pointer-events: none;
        opacity: 0.22;
        mix-blend-mode: overlay;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.55'/%3E%3C/svg%3E");
        background-size: 180px 180px;
      }
      #maf-vignette {
        position: absolute; inset: 0;
        pointer-events: none;
        background: radial-gradient(ellipse at center, transparent 42%, rgba(0,0,0,0.55) 100%);
      }
      #maf-credit {
        position: absolute;
        left: 48px; bottom: 28px;
        z-index: 5;
        color: var(--maf-credit);
        font-size: 14px;
        letter-spacing: 0.06em;
        max-width: 1100px;
        text-transform: none;
        font-weight: 400;
      }
      .maf-label {
        fill: var(--maf-label);
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        font-weight: 700;
        letter-spacing: 0.12em;
      }
    </style>
  </head>

        var border = document.getElementById("maf-inner-border");

        var arrowIds = ["maf-a0", "maf-a1", "maf-a2", "maf-a3", "maf-a4", "maf-a5"];
        var arrowLens = [];
        for (var i = 0; i < arrowIds.length; i++) {
          var a = document.getElementById(arrowIds[i]);
          var len = a.getTotalLength();
          arrowLens.push(len);
          gsap.set(a, { strokeDasharray: len, strokeDashoffset: len });
          var tr = document.getElementById(arrowIds[i] + "-trail");
          if (tr) {
            var tlen = tr.getTotalLength();
            gsap.set(tr, { strokeDasharray: tlen, strokeDashoffset: tlen });
          }
        }

        gsap.set("#maf-camera", { scale: 1, x: 0, y: 0 });
        gsap.set("#maf-berlin-layer", { opacity: 0 });
        gsap.set("#maf-berlin-pin", { opacity: 0 });
        gsap.set("#maf-label-federal", { opacity: 0 });
        gsap.set("#maf-label-peoples", { opacity: 0 });
        gsap.set("#maf-both-red", { opacity: 0 });
        gsap.set("#maf-arrows", { opacity: 0 });
        gsap.set("#maf-berlin-label-close", { opacity: 0 });
        gsap.set("#maf-endcard", { opacity: 0 });
        gsap.set("#maf-stage", { opacity: 0 });
        gsap.set("#maf-east", { fill: "#909090" });

        var tl = gsap.timeline({ paused: true });

        // Act1: fade in Germany
        tl.to("#maf-stage", { opacity: 1, duration: 0.9, ease: "power1.out" }, 0);

        // Act1 end: jagged border draws N→S (~8-10s)
        tl.to(border, { strokeDashoffset: 0, duration: 2.0, ease: "none" }, 8.0);

        // Act2: BERLIN callout + zoom (~11-15)
        tl.to("#maf-berlin-pin", { opacity: 1, duration: 0.45, ease: "power1.out" }, 11.0);
        tl.to(
          "#maf-camera",
          {
            scale: 4.2,
            x: -380,
            y: 80,
            duration: 3.8,
            ease: "power1.inOut",
            transformOrigin: "1038px 482px",
          },
          12.0
        );

        // Crossfade to Berlin sectors (~15.6)
        tl.to("#maf-berlin-layer", { opacity: 1, duration: 0.7, ease: "power1.inOut" }, 15.6);
        tl.to("#maf-camera", { opacity: 0.15, duration: 0.7 }, 15.6);
        // BERLIN close-label: hidden on sector/airlift (not on ref t19/t23)
        // tl.to("#maf-berlin-label-close", { opacity: 1, duration: 0.4 }, 16.2);

        // Act4: airlift arrows fan W→E (~21-26) - thick short shafts + trail bloom + heads
        tl.to("#maf-arrows", { opacity: 1, duration: 0.25 }, 20.8);
        for (i = 0; i < arrowIds.length; i++) {
          var start = 21.0 + i * 0.14;
          var trailEl = document.getElementById(arrowIds[i] + "-trail");
          if (trailEl) {
            tl.to(trailEl, { strokeDashoffset: 0, duration: 0.7, ease: "power2.out" }, start);
          }
          tl.to(
            document.getElementById(arrowIds[i]),
            { strokeDashoffset: 0, duration: 0.55, ease: "power2.out" },
            start + 0.05
          );
          tl.to(
            document.getElementById(arrowIds[i] + "-head"),
            { opacity: 1, duration: 0.25, ease: "power1.out" },
            start + 0.4
          );
        }

        // Act5: zoom out + republic labels (~26.5-34)
        tl.to("#maf-arrows", { opacity: 0, duration: 0.8 }, 26.2);
        tl.to("#maf-berlin-label-close", { opacity: 0, duration: 0.5 }, 26.2);
        tl.to("#maf-berlin-layer", { opacity: 0, duration: 1.0, ease: "power1.inOut" }, 26.5);
        tl.to("#maf-camera", { opacity: 1, scale: 1, x: 0, y: 0, duration: 3.5, ease: "power1.inOut" }, 26.5);
        tl.to("#maf-both-red", { opacity: 1, duration: 0.6 }, 28.0);
        tl.to("#maf-west", { opacity: 0, duration: 0.4 }, 28.0);
        tl.to("#maf-east", { opacity: 0, duration: 0.4 }, 28.0);
        tl.to("#maf-label-federal", { opacity: 1, duration: 0.5 }, 28.6);
        tl.to("#maf-label-peoples", { opacity: 1, duration: 0.5 }, 28.75);
