<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>

      *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
      body { background: #1a1714; overflow: hidden; }
      #root-map-arrow-fanout {
        position: relative; width: 1920px; height: 1080px; overflow: hidden;
        background: #1a1714; font-family: Georgia, "Times New Roman", serif;
      }
      #maf-frame {
        position: absolute; inset: 48px;
        border: 1px solid rgba(196, 181, 154, 0.14); background: #221e19;
      }
      #maf-svg { position: absolute; inset: 0; width: 100%; height: 100%; }
      #maf-title {
        position: absolute; top: 72px; left: 96px;
        color: rgba(232, 220, 196, 0.92); font-size: 42px;
        letter-spacing: 0.08em; text-transform: uppercase; font-weight: 400;
      }
      #maf-subtitle {
        position: absolute; top: 128px; left: 96px;
        color: rgba(196, 181, 154, 0.55); font-size: 22px;
        letter-spacing: 0.18em; text-transform: uppercase;
      }
      #maf-note {
        position: absolute; bottom: 88px; left: 96px;
        color: rgba(196, 181, 154, 0.55); font-size: 16px;
        letter-spacing: 0.1em; text-transform: uppercase; max-width: 900px;
      }

    </style>
  </head>
  <body>
    <div id="root-map-arrow-fanout" data-composition-id="map-arrow-fanout"
      data-start="0" data-duration="8" data-width="1920" data-height="1080">
      <div id="maf-frame">
        <svg id="maf-svg" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <defs>
            <pattern id="maf-hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
              <line x1="0" y1="0" x2="0" y2="12" stroke="rgba(196,181,154,0.08)" stroke-width="1" />
            </pattern>
          </defs>

          <rect width="1920" height="1080" fill="#1f1b17" />
          <rect width="1920" height="1080" fill="url(#maf-hatch)" />
          <path id="maf-land" d="M 280 320 C 340 220 480 180 620 210 C 760 240 820 300 900 280 C 980 260 1080 300 1180 340 C 1280 380 1360 460 1380 560 C 1400 660 1340 760 1240 820 C 1140 880 980 900 860 860 C 740 820 700 780 620 800 C 540 820 420 780 360 700 C 300 620 240 500 280 320 Z" fill="rgba(196,181,154,0.16)" stroke="rgba(196,181,154,0.4)" stroke-width="2" />
          <path id="maf-island" d="M 1480 420 C 1540 400 1600 430 1610 480 C 1620 530 1580 570 1520 560 C 1460 550 1450 450 1480 420 Z" fill="rgba(196,181,154,0.12)" stroke="rgba(196,181,154,0.3)" stroke-width="1.5" />

          <defs>
            <marker id="maf-head" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
              <path d="M 0 0 L 10 5 L 0 10 Z" fill="#c45c26" />
            </marker>
          </defs>
          <circle id="maf-origin" cx="520" cy="600" r="12" fill="#c45c26" />
          <path id="maf-a0" d="M 520 600 L 700 480" fill="none" stroke="#c45c26" stroke-width="3.5" stroke-linecap="round" marker-end="url(#maf-head)" />
<path id="maf-a1" d="M 520 600 L 780 540" fill="none" stroke="#c45c26" stroke-width="3.5" stroke-linecap="round" marker-end="url(#maf-head)" />
<path id="maf-a2" d="M 520 600 L 820 620" fill="none" stroke="#c45c26" stroke-width="3.5" stroke-linecap="round" marker-end="url(#maf-head)" />
<path id="maf-a3" d="M 520 600 L 760 700" fill="none" stroke="#c45c26" stroke-width="3.5" stroke-linecap="round" marker-end="url(#maf-head)" />
<path id="maf-a4" d="M 520 600 L 680 740" fill="none" stroke="#c45c26" stroke-width="3.5" stroke-linecap="round" marker-end="url(#maf-head)" />
<path id="maf-a5" d="M 520 600 L 860 500" fill="none" stroke="#c45c26" stroke-width="3.5" stroke-linecap="round" marker-end="url(#maf-head)" />
<path id="maf-a6" d="M 520 600 L 900 580" fill="none" stroke="#c45c26" stroke-width="3.5" stroke-linecap="round" marker-end="url(#maf-head)" />
<path id="maf-a7" d="M 520 600 L 880 660" fill="none" stroke="#c45c26" stroke-width="3.5" stroke-linecap="round" marker-end="url(#maf-head)" />

        </svg>
      </div>
      <div id="maf-title" data-var-text="title">Advance Fan-Out</div>
      <div id="maf-subtitle" data-var-text="subtitle">Educational cartography · arrow swarm</div>
      <div id="maf-note">Abstract arrow fan-out — educational schematic only</div>
    </div>
    <script>
      (function () {
        window.__timelines = window.__timelines || {};
        var vars = window.__hyperframes && window.__hyperframes.getVariables
          ? window.__hyperframes.getVariables() : {};
        var accent = /^#[0-9a-fA-F]{6}$/.test(String(vars.accent || ""))
          ? String(vars.accent) : "#c45c26";
        var title = typeof vars.title === "string" && vars.title ? vars.title : "Advance Fan-Out";
        var subtitle = typeof vars.subtitle === "string" && vars.subtitle ? vars.subtitle : "Educational cartography \u00b7 arrow swarm";
document.getElementById("maf-title").textContent = title;
        document.getElementById("maf-subtitle").textContent = subtitle;
        document.getElementById("maf-origin").setAttribute("fill", accent);
        var head = document.querySelector("#maf-head path"); if (head) head.setAttribute("fill", accent);
        gsap.set(["#maf-land","#maf-island","#maf-title","#maf-subtitle","#maf-note","#maf-origin"], { opacity: 0 });
        var a0 = document.getElementById("maf-a0"); a0.setAttribute("stroke", accent); var len0 = a0.getTotalLength(); gsap.set(a0, { strokeDasharray: len0, strokeDashoffset: len0 });
        var a1 = document.getElementById("maf-a1"); a1.setAttribute("stroke", accent); var len1 = a1.getTotalLength(); gsap.set(a1, { strokeDasharray: len1, strokeDashoffset: len1 });
        var a2 = document.getElementById("maf-a2"); a2.setAttribute("stroke", accent); var len2 = a2.getTotalLength(); gsap.set(a2, { strokeDasharray: len2, strokeDashoffset: len2 });
        var a3 = document.getElementById("maf-a3"); a3.setAttribute("stroke", accent); var len3 = a3.getTotalLength(); gsap.set(a3, { strokeDasharray: len3, strokeDashoffset: len3 });
        var a4 = document.getElementById("maf-a4"); a4.setAttribute("stroke", accent); var len4 = a4.getTotalLength(); gsap.set(a4, { strokeDasharray: len4, strokeDashoffset: len4 });
        var a5 = document.getElementById("maf-a5"); a5.setAttribute("stroke", accent); var len5 = a5.getTotalLength(); gsap.set(a5, { strokeDasharray: len5, strokeDashoffset: len5 });
        var a6 = document.getElementById("maf-a6"); a6.setAttribute("stroke", accent); var len6 = a6.getTotalLength(); gsap.set(a6, { strokeDasharray: len6, strokeDashoffset: len6 });
        var a7 = document.getElementById("maf-a7"); a7.setAttribute("stroke", accent); var len7 = a7.getTotalLength(); gsap.set(a7, { strokeDasharray: len7, strokeDashoffset: len7 });
        var tl = gsap.timeline({ paused: true });
        tl.to("#maf-land", { opacity: 1, duration: 0.5 }, 0);
        tl.to("#maf-island", { opacity: 1, duration: 0.4 }, 0.1);
        tl.to("#maf-title", { opacity: 1, duration: 0.4 }, 0.15);
        tl.to("#maf-subtitle", { opacity: 1, duration: 0.35 }, 0.35);
        tl.to("#maf-origin", { opacity: 1, duration: 0.3 }, 0.7);
        tl.to(a0, { strokeDashoffset: 0, duration: 0.7, ease: "power2.out" }, 1.00);
        tl.to(a1, { strokeDashoffset: 0, duration: 0.7, ease: "power2.out" }, 1.22);
        tl.to(a2, { strokeDashoffset: 0, duration: 0.7, ease: "power2.out" }, 1.44);
        tl.to(a3, { strokeDashoffset: 0, duration: 0.7, ease: "power2.out" }, 1.66);
        tl.to(a4, { strokeDashoffset: 0, duration: 0.7, ease: "power2.out" }, 1.88);
        tl.to(a5, { strokeDashoffset: 0, duration: 0.7, ease: "power2.out" }, 2.10);
        tl.to(a6, { strokeDashoffset: 0, duration: 0.7, ease: "power2.out" }, 2.32);
        tl.to(a7, { strokeDashoffset: 0, duration: 0.7, ease: "power2.out" }, 2.54);
        tl.to("#maf-note", { opacity: 1, duration: 0.4 }, 5.2);
        window.__timelines["map-arrow-fanout"] = tl;
      })();
    </script>
  </body>
</html>
