<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: #1a1714;
        overflow: hidden;
      }
      #root-map-border-chase {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #1a1714;
        font-family: Georgia, "Times New Roman", serif;
      }
      #mbc-frame {
        position: absolute;
        inset: 48px;
        border: 1px solid rgba(196, 181, 154, 0.14);
        background: #221e19;
      }
      #mbc-svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      #mbc-title {
        position: absolute;
        top: 72px;
        left: 96px;
        color: rgba(232, 220, 196, 0.92);
        font-size: 42px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        font-weight: 400;
      }
      #mbc-subtitle {
        position: absolute;
        top: 128px;
        left: 96px;
        color: rgba(196, 181, 154, 0.55);
        font-size: 22px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }
      #mbc-note {
        position: absolute;
        bottom: 88px;
        left: 96px;
        color: rgba(196, 181, 154, 0.55);
        font-size: 16px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        max-width: 900px;
      }
    </style>
  </head>
  <body>
    <div
      id="root-map-border-chase"
      data-composition-id="map-border-chase"
      data-start="0"
      data-duration="8"
      data-width="1920"
      data-height="1080"
    >
      <div id="mbc-frame">
        <svg
          id="mbc-svg"
          viewBox="0 0 1920 1080"
          xmlns="http://www.w3.org/2000/svg"
          aria-hidden="true"
        >
          <defs>
            <pattern
              id="mbc-hatch"
              width="12"
              height="12"
              patternUnits="userSpaceOnUse"
              patternTransform="rotate(35)"
            >
              <line x1="0" y1="0" x2="0" y2="12" stroke="rgba(196,181,154,0.08)" stroke-width="1" />
            </pattern>
          </defs>

          <rect width="1920" height="1080" fill="#1f1b17" />
          <rect width="1920" height="1080" fill="url(#mbc-hatch)" />
          <path
            id="mbc-land"
            d="M 280 320 C 340 220 480 180 620 210 C 760 240 820 300 900 280 C 980 260 1080 300 1180 340 C 1280 380 1360 460 1380 560 C 1400 660 1340 760 1240 820 C 1140 880 980 900 860 860 C 740 820 700 780 620 800 C 540 820 420 780 360 700 C 300 620 240 500 280 320 Z"
            fill="rgba(196,181,154,0.16)"
            stroke="rgba(196,181,154,0.4)"
            stroke-width="2"
          />
          <path
            id="mbc-island"
            d="M 1480 420 C 1540 400 1600 430 1610 480 C 1620 530 1580 570 1520 560 C 1460 550 1450 450 1480 420 Z"
            fill="rgba(196,181,154,0.12)"
            stroke="rgba(196,181,154,0.3)"
            stroke-width="1.5"
          />

          <path
            id="mbc-border"
            d="M 280 320 C 340 220 480 180 620 210 C 760 240 820 300 900 280 C 980 260 1080 300 1180 340 C 1280 380 1360 460 1380 560 C 1400 660 1340 760 1240 820 C 1140 880 980 900 860 860 C 740 820 700 780 620 800 C 540 820 420 780 360 700 C 300 620 240 500 280 320 Z"
            fill="none"
            stroke="#c45c26"
            stroke-width="5"
            stroke-linecap="round"
          />
          <path
            id="mbc-glow"
            d="M 280 320 C 340 220 480 180 620 210 C 760 240 820 300 900 280 C 980 260 1080 300 1180 340 C 1280 380 1360 460 1380 560 C 1400 660 1340 760 1240 820 C 1140 880 980 900 860 860 C 740 820 700 780 620 800 C 540 820 420 780 360 700 C 300 620 240 500 280 320 Z"
            fill="none"
            stroke="#e8dcc4"
            stroke-width="2"
            stroke-linecap="round"
            opacity="0.7"
          />
        </svg>
      </div>
      <div id="mbc-title" data-var-text="title">Frontier Trace</div>
      <div id="mbc-subtitle" data-var-text="subtitle">Educational cartography · border chase</div>
      <div id="mbc-note">Border highlight chase along the landmass stroke</div>
    </div>
    <script>
      (function () {
        window.__timelines = window.__timelines || {};
        var vars =
          window.__hyperframes && window.__hyperframes.getVariables
            ? window.__hyperframes.getVariables()
            : {};
        var accent = /^#[0-9a-fA-F]{6}$/.test(String(vars.accent || ""))
          ? String(vars.accent)
          : "#c45c26";
        var title = typeof vars.title === "string" && vars.title ? vars.title : "Frontier Trace";
        var subtitle =
          typeof vars.subtitle === "string" && vars.subtitle
            ? vars.subtitle
            : "Educational cartography \u00b7 border chase";

        document.getElementById("mbc-title").textContent = title;
        document.getElementById("mbc-subtitle").textContent = subtitle;
        var border = document.getElementById("mbc-border");
        var glow = document.getElementById("mbc-glow");
        border.setAttribute("stroke", accent);
        var len = border.getTotalLength();
        gsap.set(border, { strokeDasharray: len * 0.18 + " " + len, strokeDashoffset: len });
        gsap.set(glow, { strokeDasharray: len * 0.08 + " " + len, strokeDashoffset: len });
        gsap.set(["#mbc-land", "#mbc-island", "#mbc-title", "#mbc-subtitle", "#mbc-note"], {
          opacity: 0,
        });
        var tl = gsap.timeline({ paused: true });
        tl.to("#mbc-land", { opacity: 1, duration: 0.5 }, 0);
        tl.to("#mbc-island", { opacity: 1, duration: 0.4 }, 0.1);
        tl.to("#mbc-title", { opacity: 1, duration: 0.4 }, 0.15);
        tl.to("#mbc-subtitle", { opacity: 1, duration: 0.35 }, 0.35);
        tl.to(border, { strokeDashoffset: -len, duration: 5.5, ease: "none" }, 0.9);
        tl.to(glow, { strokeDashoffset: -len, duration: 5.5, ease: "none" }, 0.9);
        tl.to("#mbc-note", { opacity: 1, duration: 0.4 }, 5.5);
        window.__timelines["map-border-chase"] = tl;
      })();
    </script>
  </body>
</html>
