<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: #0a0a0a;
        overflow: hidden;
      }
      #root-map-conquest-fill-sequence {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #0a0a0a;
        font-family: "Helvetica Neue", Helvetica, sans-serif;
      }
      #cfs-video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        background: #000;
      }
      #cfs-frame {
        position: absolute;
        inset: 36px;
        border: 1px solid rgba(232, 220, 196, 0.28);
        pointer-events: none;
      }
      #cfs-title {
        position: absolute;
        left: 72px;
        top: 56px;
        max-width: 1600px;
        color: rgba(245, 236, 214, 0.95);
        font-size: 34px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        text-shadow: 0 2px 12px rgba(0, 0, 0, 0.75);
      }
      #cfs-credit {
        position: absolute;
        left: 72px;
        right: 72px;
        bottom: 56px;
        color: rgba(232, 220, 196, 0.88);
        font-size: 16px;
        letter-spacing: 0.06em;
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
      }
      #cfs-credit-url {
        display: block;
        margin-top: 8px;
        font-size: 13px;
        letter-spacing: 0.03em;
        color: rgba(196, 181, 154, 0.7);
      }
    </style>
  </head>
  <body>
    <div
      id="root-map-conquest-fill-sequence"
      data-composition-id="map-conquest-fill-sequence"
      data-start="0"
      data-duration="12.01"
      data-width="1920"
      data-height="1080"
    >
      <video
        id="cfs-video"
        src="assets/clip.mp4"
        muted
        playsinline
        preload="auto"
        data-start="0"
        data-duration="12.01"
        data-media-start="0"
      ></video>
      <div id="cfs-frame" aria-hidden="true"></div>
      <div id="cfs-title" data-var-text="title">Man On The Land (1951)</div>
      <div id="cfs-credit">
        <span data-var-text="credit">Moving Image Archive, Man On The Land, 1951</span>
        <span id="cfs-credit-url"
          >https://www.movingimagearchive.com/sources/man-on-the-land-1a9bf502?clip=008090d0-9ab5-5a46-9152-1389094bb21d
          - Rights: public_domain / free to reuse</span
        >
      </div>
    </div>
    <script>
      (function () {
        window.__timelines = window.__timelines || {};

        var vars =
          window.__hyperframes && window.__hyperframes.getVariables
            ? window.__hyperframes.getVariables()
            : {};

        var title =
          typeof vars.title === "string" && vars.title ? vars.title : "Man On The Land (1951)";
        var credit =
          typeof vars.credit === "string" && vars.credit
            ? vars.credit
            : "Moving Image Archive, Man On The Land, 1951";

        document.getElementById("cfs-title").textContent = title;
        document.querySelector('#cfs-credit [data-var-text="credit"]').textContent = credit;

        var tl = gsap.timeline({ paused: true });
        tl.fromTo(
          "#cfs-title",
          { opacity: 0 },
          { opacity: 1, duration: 0.6, ease: "power1.out" },
          0,
        );
        tl.fromTo(
          "#cfs-credit",
          { opacity: 0 },
          { opacity: 1, duration: 0.6, ease: "power1.out" },
          0.15,
        );
        tl.to({}, { duration: Math.max(0.01, 12.01 - 0.75) });

        window.__timelines["map-conquest-fill-sequence"] = tl;
      })();
    </script>
  </body>
</html>
