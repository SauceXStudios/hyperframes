<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: #1a1714;
        overflow: hidden;
      }
      #root-map-conquest-fill-sequence {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #1a1714;
        font-family: Georgia, "Times New Roman", serif;
      }
      #mcf-frame {
        position: absolute;
        inset: 48px;
        border: 1px solid rgba(196, 181, 154, 0.14);
        background: #221e19;
      }
      #mcf-svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      #mcf-title {
        position: absolute;
        top: 72px;
        left: 96px;
        color: rgba(232, 220, 196, 0.92);
        font-size: 42px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        font-weight: 400;
      }
      #mcf-subtitle {
        position: absolute;
        top: 128px;
        left: 96px;
        color: rgba(196, 181, 154, 0.55);
        font-size: 22px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }
      #mcf-note {
        position: absolute;
        bottom: 88px;
        left: 96px;
        color: rgba(196, 181, 154, 0.55);
        font-size: 16px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        max-width: 900px;
      }
    </style>
  </head>
  <body>
    <div
      id="root-map-conquest-fill-sequence"
      data-composition-id="map-conquest-fill-sequence"
      data-start="0"
      data-duration="8"
      data-width="1920"
      data-height="1080"
    >
      <div id="mcf-frame">
        <svg
          id="mcf-svg"
          viewBox="0 0 1920 1080"
          xmlns="http://www.w3.org/2000/svg"
          aria-hidden="true"
        >
          <defs>
            <pattern
              id="mcf-hatch"
              width="12"
              height="12"
              patternUnits="userSpaceOnUse"
              patternTransform="rotate(35)"
            >
              <line x1="0" y1="0" x2="0" y2="12" stroke="rgba(196,181,154,0.08)" stroke-width="1" />
            </pattern>
          </defs>

          <rect width="1920" height="1080" fill="#1f1b17" />
          <rect width="1920" height="1080" fill="url(#mcf-hatch)" />
          <path
            id="mcf-land"
            d="M 280 320 C 340 220 480 180 620 210 C 760 240 820 300 900 280 C 980 260 1080 300 1180 340 C 1280 380 1360 460 1380 560 C 1400 660 1340 760 1240 820 C 1140 880 980 900 860 860 C 740 820 700 780 620 800 C 540 820 420 780 360 700 C 300 620 240 500 280 320 Z"
            fill="rgba(196,181,154,0.16)"
            stroke="rgba(196,181,154,0.4)"
            stroke-width="2"
          />
          <path
            id="mcf-island"
            d="M 1480 420 C 1540 400 1600 430 1610 480 C 1620 530 1580 570 1520 560 C 1460 550 1450 450 1480 420 Z"
            fill="rgba(196,181,154,0.12)"
            stroke="rgba(196,181,154,0.3)"
            stroke-width="1.5"
          />
          <path
            id="mcf-r1"
            d="M 400 500 C 480 440 560 450 600 520 C 640 590 560 650 480 640 C 400 630 360 560 400 500 Z"
            fill="#c45c26"
            opacity="0.35"
            stroke="#c45c26"
            stroke-width="2"
          />
          <path
            id="mcf-r2"
            d="M 620 420 C 720 380 820 400 860 480 C 900 560 820 620 720 610 C 620 600 560 500 620 420 Z"
            fill="#c45c26"
            opacity="0.35"
            stroke="#c45c26"
            stroke-width="2"
          />
          <path
            id="mcf-r3"
            d="M 880 460 C 980 420 1080 450 1120 530 C 1160 610 1080 680 980 670 C 880 660 820 540 880 460 Z"
            fill="#c45c26"
            opacity="0.35"
            stroke="#c45c26"
            stroke-width="2"
          />
          <path
            id="mcf-r4"
            d="M 1140 520 C 1240 480 1340 520 1360 600 C 1380 680 1280 740 1180 720 C 1080 700 1060 580 1140 520 Z"
            fill="#c45c26"
            opacity="0.35"
            stroke="#c45c26"
            stroke-width="2"
          />
        </svg>
      </div>
      <div id="mcf-title" data-var-text="title">Sequential Fill</div>
      <div id="mcf-subtitle" data-var-text="subtitle">Educational cartography · conquest fill</div>
      <div id="mcf-note">Abstract sequential fill - not a depiction of any real conquest</div>
    </div>
    <script>
      (function () {
        window.__timelines = window.__timelines || {};
        var vars =
          window.__hyperframes && window.__hyperframes.getVariables
            ? window.__hyperframes.getVariables()
            : {};
        var accent = /^#[0-9a-fA-F]{6}$/.test(String(vars.accent || ""))
          ? String(vars.accent)
          : "#c45c26";
        var title = typeof vars.title === "string" && vars.title ? vars.title : "Sequential Fill";
        var subtitle =
          typeof vars.subtitle === "string" && vars.subtitle
            ? vars.subtitle
            : "Educational cartography \u00b7 conquest fill";

        document.getElementById("mcf-title").textContent = title;
        document.getElementById("mcf-subtitle").textContent = subtitle;
        ["mcf-r1", "mcf-r2", "mcf-r3", "mcf-r4"].forEach(function (id) {
          var el = document.getElementById(id);
          el.setAttribute("fill", accent);
          el.setAttribute("stroke", accent);
        });
        gsap.set(["#mcf-land", "#mcf-island", "#mcf-title", "#mcf-subtitle", "#mcf-note"], {
          opacity: 0,
        });
        gsap.set(["#mcf-r1", "#mcf-r2", "#mcf-r3", "#mcf-r4"], {
          opacity: 0,
          scale: 0.85,
          transformOrigin: "50% 50%",
        });
        var tl = gsap.timeline({ paused: true });
        tl.to("#mcf-land", { opacity: 1, duration: 0.5 }, 0);
        tl.to("#mcf-island", { opacity: 1, duration: 0.4 }, 0.1);
        tl.to("#mcf-title", { opacity: 1, duration: 0.4 }, 0.15);
        tl.to("#mcf-subtitle", { opacity: 1, duration: 0.35 }, 0.35);
        tl.to("#mcf-r1", { opacity: 0.4, scale: 1, duration: 0.7, ease: "power2.out" }, 1.0);
        tl.to("#mcf-r2", { opacity: 0.4, scale: 1, duration: 0.7, ease: "power2.out" }, 2.0);
        tl.to("#mcf-r3", { opacity: 0.4, scale: 1, duration: 0.7, ease: "power2.out" }, 3.0);
        tl.to("#mcf-r4", { opacity: 0.4, scale: 1, duration: 0.7, ease: "power2.out" }, 4.0);
        tl.to("#mcf-note", { opacity: 1, duration: 0.4 }, 5.2);
        window.__timelines["map-conquest-fill-sequence"] = tl;
      })();
    </script>
  </body>
</html>
