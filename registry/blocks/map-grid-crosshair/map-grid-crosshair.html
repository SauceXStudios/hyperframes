<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: #1a1714;
        overflow: hidden;
      }
      #root-map-grid-crosshair {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #1a1714;
        font-family: Georgia, "Times New Roman", serif;
      }
      #mgc-frame {
        position: absolute;
        inset: 48px;
        border: 1px solid rgba(196, 181, 154, 0.14);
        background: #221e19;
      }
      #mgc-svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      #mgc-title {
        position: absolute;
        top: 72px;
        left: 96px;
        color: rgba(232, 220, 196, 0.92);
        font-size: 42px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        font-weight: 400;
      }
      #mgc-subtitle {
        position: absolute;
        top: 128px;
        left: 96px;
        color: rgba(196, 181, 154, 0.55);
        font-size: 22px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }
      #mgc-note {
        position: absolute;
        bottom: 88px;
        left: 96px;
        color: rgba(196, 181, 154, 0.55);
        font-size: 16px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        max-width: 900px;
      }
    </style>
  </head>
  <body>
    <div
      id="root-map-grid-crosshair"
      data-composition-id="map-grid-crosshair"
      data-start="0"
      data-duration="7"
      data-width="1920"
      data-height="1080"
    >
      <div id="mgc-frame">
        <svg
          id="mgc-svg"
          viewBox="0 0 1920 1080"
          xmlns="http://www.w3.org/2000/svg"
          aria-hidden="true"
        >
          <defs>
            <pattern
              id="mgc-hatch"
              width="12"
              height="12"
              patternUnits="userSpaceOnUse"
              patternTransform="rotate(35)"
            >
              <line x1="0" y1="0" x2="0" y2="12" stroke="rgba(196,181,154,0.08)" stroke-width="1" />
            </pattern>
          </defs>

          <rect width="1920" height="1080" fill="#1f1b17" />
          <rect width="1920" height="1080" fill="url(#mgc-hatch)" />
          <path
            id="mgc-land"
            d="M 280 320 C 340 220 480 180 620 210 C 760 240 820 300 900 280 C 980 260 1080 300 1180 340 C 1280 380 1360 460 1380 560 C 1400 660 1340 760 1240 820 C 1140 880 980 900 860 860 C 740 820 700 780 620 800 C 540 820 420 780 360 700 C 300 620 240 500 280 320 Z"
            fill="rgba(196,181,154,0.16)"
            stroke="rgba(196,181,154,0.4)"
            stroke-width="2"
          />
          <path
            id="mgc-island"
            d="M 1480 420 C 1540 400 1600 430 1610 480 C 1620 530 1580 570 1520 560 C 1460 550 1450 450 1480 420 Z"
            fill="rgba(196,181,154,0.12)"
            stroke="rgba(196,181,154,0.3)"
            stroke-width="1.5"
          />

          <g id="mgc-grid">
            <line
              class="mgc-v"
              x1="240"
              y1="160"
              x2="240"
              y2="920"
              stroke="rgba(196,181,154,0.18)"
              stroke-width="1"
            />
            <line
              class="mgc-v"
              x1="360"
              y1="160"
              x2="360"
              y2="920"
              stroke="rgba(196,181,154,0.18)"
              stroke-width="1"
            />
            <line

            />

            />
            <line

            />
            <line

              y2="920"

              stroke-width="1"
            />
            <line
              class="mgc-v"
              x1="1200"

              y2="920"

              stroke-width="1"
            />
            <line
              class="mgc-v"

              stroke="rgba(196,181,154,0.18)"
              stroke-width="1"
            />
            <line
              class="mgc-v"
              x1="1440"
              y1="160"
              x2="1440"
              y2="920"
              stroke="rgba(196,181,154,0.18)"
              stroke-width="1"
            />
            <line
              class="mgc-v"
              x1="1560"

            />
            <line

            <line

            />
            <line

            />
          </g>
          <line
            id="mgc-ch-h"
            x1="200"
            y1="520"
            x2="1720"
            y2="520"
            stroke="#c45c26"
            stroke-width="2"
          />
          <line
            id="mgc-ch-v"
            x1="980"
            y1="160"
            x2="980"
            y2="920"
            stroke="#c45c26"
            stroke-width="2"
          />
          <circle
            id="mgc-lock"
            cx="980"
            cy="520"
            r="16"
            fill="none"
            stroke="#c45c26"
            stroke-width="3"
          />
          <circle id="mgc-dot" cx="980" cy="520" r="5" fill="#c45c26" />
        </svg>
      </div>
      <div id="mgc-title" data-var-text="title">Grid Lock</div>
      <div id="mgc-subtitle" data-var-text="subtitle">Educational cartography · lat-long lock</div>
      <div id="mgc-note">Grid draw + crosshair lock · schematic only</div>
    </div>
    <script>
      (function () {
        window.__timelines = window.__timelines || {};
        var vars =
          window.__hyperframes && window.__hyperframes.getVariables
            ? window.__hyperframes.getVariables()
            : {};
        var accent = /^#[0-9a-fA-F]{6}$/.test(String(vars.accent || ""))
          ? String(vars.accent)
          : "#c45c26";
        var title = typeof vars.title === "string" && vars.title ? vars.title : "Grid Lock";
        var subtitle =
          typeof vars.subtitle === "string" && vars.subtitle
            ? vars.subtitle
            : "Educational cartography \u00b7 lat-long lock";

        document.getElementById("mgc-title").textContent = title;
        document.getElementById("mgc-subtitle").textContent = subtitle;
        ["mgc-ch-h", "mgc-ch-v", "mgc-lock"].forEach(function (id) {
          document.getElementById(id).setAttribute("stroke", accent);
        });
        document.getElementById("mgc-dot").setAttribute("fill", accent);
        gsap.set(
          ["#mgc-land", "#mgc-island", "#mgc-title", "#mgc-subtitle", "#mgc-note", "#mgc-grid"],
          { opacity: 0 },
        );
        gsap.set(["#mgc-ch-h", "#mgc-ch-v"], { opacity: 0, scaleX: 0, transformOrigin: "50% 50%" });
        gsap.set("#mgc-ch-v", { scaleX: 1, scaleY: 0 });
        gsap.set(["#mgc-lock", "#mgc-dot"], {
          opacity: 0,
          scale: 0.4,
          transformOrigin: "50% 50%",
          svgOrigin: "980px 520px",
        });
        var tl = gsap.timeline({ paused: true });
        tl.to("#mgc-land", { opacity: 1, duration: 0.5 }, 0);
        tl.to("#mgc-island", { opacity: 1, duration: 0.4 }, 0.1);
        tl.to("#mgc-title", { opacity: 1, duration: 0.4 }, 0.15);
        tl.to("#mgc-subtitle", { opacity: 1, duration: 0.35 }, 0.35);
        tl.to("#mgc-grid", { opacity: 1, duration: 1.2, ease: "power1.out" }, 0.8);
        tl.to("#mgc-ch-h", { opacity: 1, scaleX: 1, duration: 0.7, ease: "power2.out" }, 2.2);
        tl.to("#mgc-ch-v", { opacity: 1, scaleY: 1, duration: 0.7, ease: "power2.out" }, 2.5);
        tl.to(
          ["#mgc-lock", "#mgc-dot"],
          { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(1.8)" },
          3.4,
        );
        tl.to("#mgc-note", { opacity: 1, duration: 0.4 }, 4.5);
        window.__timelines["map-grid-crosshair"] = tl;
      })();
    </script>
  </body>
</html>
