<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: #1a1714;
        overflow: hidden;
      }
      #root-map-legend-build {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #1a1714;
        font-family: Georgia, "Times New Roman", serif;
      }
      #mlb-frame {
        position: absolute;
        inset: 48px;
        border: 1px solid rgba(196, 181, 154, 0.14);
        background: #221e19;
      }
      #mlb-svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      #mlb-title {
        position: absolute;
        top: 72px;
        left: 96px;
        color: rgba(232, 220, 196, 0.92);
        font-size: 42px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        font-weight: 400;
      }
      #mlb-subtitle {
        position: absolute;
        top: 128px;
        left: 96px;
        color: rgba(196, 181, 154, 0.55);
        font-size: 22px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }
      #mlb-note {
        position: absolute;
        bottom: 88px;
        left: 96px;
        color: rgba(196, 181, 154, 0.55);
        font-size: 16px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        max-width: 900px;
      }
    </style>
  </head>
  <body>
    <div
      id="root-map-legend-build"
      data-composition-id="map-legend-build"
      data-start="0"
      data-duration="7"
      data-width="1920"
      data-height="1080"
    >
      <div id="mlb-frame">
        <svg
          id="mlb-svg"
          viewBox="0 0 1920 1080"
          xmlns="http://www.w3.org/2000/svg"
          aria-hidden="true"
        >
          <defs>
            <pattern
              id="mlb-hatch"
              width="12"
              height="12"
              patternUnits="userSpaceOnUse"
              patternTransform="rotate(35)"
            >
              <line x1="0" y1="0" x2="0" y2="12" stroke="rgba(196,181,154,0.08)" stroke-width="1" />
            </pattern>
          </defs>

          <rect width="1920" height="1080" fill="#1f1b17" />
          <rect width="1920" height="1080" fill="url(#mlb-hatch)" />
          <path
            id="mlb-land"
            d="M 280 320 C 340 220 480 180 620 210 C 760 240 820 300 900 280 C 980 260 1080 300 1180 340 C 1280 380 1360 460 1380 560 C 1400 660 1340 760 1240 820 C 1140 880 980 900 860 860 C 740 820 700 780 620 800 C 540 820 420 780 360 700 C 300 620 240 500 280 320 Z"
            fill="rgba(196,181,154,0.16)"
            stroke="rgba(196,181,154,0.4)"
            stroke-width="2"
          />
          <path
            id="mlb-island"
            d="M 1480 420 C 1540 400 1600 430 1610 480 C 1620 530 1580 570 1520 560 C 1460 550 1450 450 1480 420 Z"
            fill="rgba(196,181,154,0.12)"
            stroke="rgba(196,181,154,0.3)"
            stroke-width="1.5"
          />

          <g id="mlb-legend" transform="translate(1380 360)">
            <rect
              id="mlb-panel"
              x="0"
              y="0"
              width="280"
              height="280"
              fill="#1a1714"
              stroke="rgba(196,181,154,0.35)"
              stroke-width="1.5"
            />
            <g id="mlb-row1">
              <rect x="24" y="36" width="28" height="16" fill="#c45c26" opacity="0.7" />
              <text
                x="68"
                y="50"
                fill="rgba(232,220,196,0.85)"
                font-size="18"
                font-family="Georgia, serif"
              >
                Territory
              </text>
            </g>
            <g id="mlb-row2">
              <line
                x1="24"
                y1="92"
                x2="52"
                y2="92"
                stroke="#c45c26"
                stroke-width="3"
                stroke-dasharray="4 6"
              />
              <text
                x="68"
                y="98"
                fill="rgba(232,220,196,0.85)"
                font-size="18"
                font-family="Georgia, serif"
              >
                Route
              </text>
            </g>
            <g id="mlb-row3">
              <circle cx="38" cy="148" r="8" fill="#c45c26" />
              <text
                x="68"
                y="154"
                fill="rgba(232,220,196,0.85)"
                font-size="18"
                font-family="Georgia, serif"
              >
                City
              </text>
            </g>
            <g id="mlb-row4">
              <polygon points="30,198 46,208 30,218" fill="#c45c26" />
              <text
                x="68"
                y="214"
                fill="rgba(232,220,196,0.85)"
                font-size="18"
                font-family="Georgia, serif"
              >
                Advance
              </text>
            </g>
          </g>
          <path
            id="mlb-sample"
            d="M 480 560 C 620 500 760 520 900 500"
            fill="none"
            stroke="#c45c26"
            stroke-width="3"
            stroke-dasharray="4 6"
          />
          <circle id="mlb-city" cx="900" cy="500" r="10" fill="#c45c26" />
        </svg>
      </div>
      <div id="mlb-title" data-var-text="title">Legend Build</div>
      <div id="mlb-subtitle" data-var-text="subtitle">
        Educational cartography · legend assemble
      </div>
      <div id="mlb-note">Legend assemble · keyed to schematic symbols</div>
    </div>
    <script>
      (function () {
        window.__timelines = window.__timelines || {};
        var vars =
          window.__hyperframes && window.__hyperframes.getVariables
            ? window.__hyperframes.getVariables()
            : {};
        var accent = /^#[0-9a-fA-F]{6}$/.test(String(vars.accent || ""))
          ? String(vars.accent)
          : "#c45c26";
        var title = typeof vars.title === "string" && vars.title ? vars.title : "Legend Build";
        var subtitle =
          typeof vars.subtitle === "string" && vars.subtitle
            ? vars.subtitle
            : "Educational cartography \u00b7 legend assemble";

        document.getElementById("mlb-title").textContent = title;
        document.getElementById("mlb-subtitle").textContent = subtitle;
        document.querySelector("#mlb-row1 rect").setAttribute("fill", accent);
        document.querySelector("#mlb-row2 line").setAttribute("stroke", accent);
        document.querySelector("#mlb-row3 circle").setAttribute("fill", accent);
        document.querySelector("#mlb-row4 polygon").setAttribute("fill", accent);
        document.getElementById("mlb-sample").setAttribute("stroke", accent);
        document.getElementById("mlb-city").setAttribute("fill", accent);
        gsap.set(
          [
            "#mlb-land",
            "#mlb-island",
            "#mlb-title",
            "#mlb-subtitle",
            "#mlb-note",
            "#mlb-sample",
            "#mlb-city",
          ],
          { opacity: 0 },
        );
        gsap.set("#mlb-panel", {
          opacity: 0,
          scaleY: 0,
          transformOrigin: "50% 0%",
          svgOrigin: "1520px 360px",
        });
        gsap.set(["#mlb-row1", "#mlb-row2", "#mlb-row3", "#mlb-row4"], { opacity: 0, x: 20 });
        var tl = gsap.timeline({ paused: true });
        tl.to("#mlb-land", { opacity: 1, duration: 0.5 }, 0);
        tl.to("#mlb-island", { opacity: 1, duration: 0.4 }, 0.1);
        tl.to("#mlb-title", { opacity: 1, duration: 0.4 }, 0.15);
        tl.to("#mlb-subtitle", { opacity: 1, duration: 0.35 }, 0.35);
        tl.to("#mlb-panel", { opacity: 1, scaleY: 1, duration: 0.55, ease: "power2.out" }, 0.9);
        tl.to("#mlb-row1", { opacity: 1, x: 0, duration: 0.35 }, 1.4);
        tl.to("#mlb-row2", { opacity: 1, x: 0, duration: 0.35 }, 1.9);
        tl.to("#mlb-sample", { opacity: 1, duration: 0.4 }, 2.1);
        tl.to("#mlb-row3", { opacity: 1, x: 0, duration: 0.35 }, 2.4);
        tl.to("#mlb-city", { opacity: 1, duration: 0.3 }, 2.6);
        tl.to("#mlb-row4", { opacity: 1, x: 0, duration: 0.35 }, 2.9);
        tl.to("#mlb-note", { opacity: 1, duration: 0.4 }, 4.2);
        window.__timelines["map-legend-build"] = tl;
      })();
    </script>
  </body>
</html>
