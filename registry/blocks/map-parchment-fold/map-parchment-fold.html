<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: #0a0a0a;
        overflow: hidden;
      }
      #root-map-parchment-fold {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #0a0a0a;
        font-family: "Helvetica Neue", Helvetica, sans-serif;
      }
      #pf-video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        background: #000;
      }
      #pf-frame {
        position: absolute;
        inset: 36px;
        border: 1px solid rgba(232, 220, 196, 0.28);
        pointer-events: none;
      }
      #pf-title {
        position: absolute;
        left: 72px;
        top: 56px;
        max-width: 1600px;
        color: rgba(245, 236, 214, 0.95);
        font-size: 34px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        text-shadow: 0 2px 12px rgba(0, 0, 0, 0.75);
      }
      #pf-credit {
        position: absolute;
        left: 72px;
        right: 72px;
        bottom: 56px;
        color: rgba(232, 220, 196, 0.88);
        font-size: 16px;
        letter-spacing: 0.06em;
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
      }
      #pf-credit-url {
        display: block;
        margin-top: 8px;
        font-size: 13px;
        letter-spacing: 0.03em;
        color: rgba(196, 181, 154, 0.7);
      }
    </style>
  </head>
  <body>
    <div
      id="root-map-parchment-fold"
      data-composition-id="map-parchment-fold"
      data-start="0"
      data-duration="12.01"
      data-width="1920"
      data-height="1080"
    >
      <video
        id="pf-video"
        src="assets/clip.mp4"
        muted
        playsinline
        preload="auto"
        data-start="0"
        data-duration="12.01"
        data-media-start="0"
      ></video>
      <div id="pf-frame" aria-hidden="true"></div>
      <div id="pf-title" data-var-text="title">AOPA-ASF: Thunderstorms and the ATC (2008)</div>
      <div id="pf-credit">
        <span data-var-text="credit"
          >Moving Image Archive, AOPA-ASF: Thunderstorms and the ATC, 2008</span
        >
        <span id="pf-credit-url"
          >https://www.movingimagearchive.com/sources/aopa-asf-thunderstorms-and-the-atc-bba0d548?clip=538de0ed-fd6e-5ac6-891c-c7bfd597cd39
          - Rights: public_domain / free to reuse</span
        >
      </div>
    </div>
    <script>
      (function () {
        window.__timelines = window.__timelines || {};

        var vars =
          window.__hyperframes && window.__hyperframes.getVariables
            ? window.__hyperframes.getVariables()
            : {};

        var title =
          typeof vars.title === "string" && vars.title
            ? vars.title
            : "AOPA-ASF: Thunderstorms and the ATC (2008)";
        var credit =
          typeof vars.credit === "string" && vars.credit
            ? vars.credit
            : "Moving Image Archive, AOPA-ASF: Thunderstorms and the ATC, 2008";

        document.getElementById("pf-title").textContent = title;
        document.querySelector('#pf-credit [data-var-text="credit"]').textContent = credit;

        var tl = gsap.timeline({ paused: true });
        tl.fromTo(
          "#pf-title",
          { opacity: 0 },
          { opacity: 1, duration: 0.6, ease: "power1.out" },
          0,
        );
        tl.fromTo(
          "#pf-credit",
          { opacity: 0 },
          { opacity: 1, duration: 0.6, ease: "power1.out" },
          0.15,
        );
        tl.to({}, { duration: Math.max(0.01, 12.01 - 0.75) });

        window.__timelines["map-parchment-fold"] = tl;
      })();
    </script>
  </body>
</html>
