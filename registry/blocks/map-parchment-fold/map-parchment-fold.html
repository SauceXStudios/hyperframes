<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>

      *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
      body { background: #1a1714; overflow: hidden; }
      #root-map-parchment-fold {
        position: relative; width: 1920px; height: 1080px; overflow: hidden;
        background: #1a1714; font-family: Georgia, "Times New Roman", serif;
      }
      #mpf-frame {
        position: absolute; inset: 48px;
        border: 1px solid rgba(196, 181, 154, 0.14); background: #221e19;
      }
      #mpf-svg { position: absolute; inset: 0; width: 100%; height: 100%; }
      #mpf-title {
        position: absolute; top: 72px; left: 96px;
        color: rgba(232, 220, 196, 0.92); font-size: 42px;
        letter-spacing: 0.08em; text-transform: uppercase; font-weight: 400;
      }
      #mpf-subtitle {
        position: absolute; top: 128px; left: 96px;
        color: rgba(196, 181, 154, 0.55); font-size: 22px;
        letter-spacing: 0.18em; text-transform: uppercase;
      }
      #mpf-note {
        position: absolute; bottom: 88px; left: 96px;
        color: rgba(196, 181, 154, 0.55); font-size: 16px;
        letter-spacing: 0.1em; text-transform: uppercase; max-width: 900px;
      }

    </style>
  </head>
  <body>
    <div id="root-map-parchment-fold" data-composition-id="map-parchment-fold"
      data-start="0" data-duration="8" data-width="1920" data-height="1080">
      <div id="mpf-frame">
        <svg id="mpf-svg" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <defs>
            <pattern id="mpf-hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
              <line x1="0" y1="0" x2="0" y2="12" stroke="rgba(196,181,154,0.08)" stroke-width="1" />
            </pattern>
          </defs>

          <rect width="1920" height="1080" fill="#c4b59a" />
          <rect width="1920" height="1080" fill="url(#mpf-hatch)" opacity="0.5" />
          <path id="mpf-land" d="M 280 320 C 340 220 480 180 620 210 C 760 240 820 300 900 280 C 980 260 1080 300 1180 340 C 1280 380 1360 460 1380 560 C 1400 660 1340 760 1240 820 C 1140 880 980 900 860 860 C 740 820 700 780 620 800 C 540 820 420 780 360 700 C 300 620 240 500 280 320 Z" fill="rgba(90,70,40,0.28)" stroke="rgba(90,70,40,0.55)" stroke-width="2" />
          <path id="mpf-island" d="M 1480 420 C 1540 400 1600 430 1610 480 C 1620 530 1580 570 1520 560 C 1460 550 1450 450 1480 420 Z" fill="rgba(90,70,40,0.2)" stroke="rgba(90,70,40,0.4)" stroke-width="1.5" />
          <path id="mpf-route" d="M 480 560 C 680 500 900 480 1120 520 C 1280 548 1400 500 1520 470"
            fill="none" stroke="#c45c26" stroke-width="3" stroke-linecap="round" />
          <line id="mpf-crease" x1="960" y1="80" x2="960" y2="1000" stroke="rgba(90,70,40,0.25)" stroke-width="2" stroke-dasharray="6 8" />

        </svg>
      </div>
      <div id="mpf-title" data-var-text="title">Parchment Chart</div>
      <div id="mpf-subtitle" data-var-text="subtitle">Educational cartography · paper fold</div>
      <div id="mpf-note">Parchment unfold · paper-map aesthetic</div>
    </div>
    <script>
      (function () {
        window.__timelines = window.__timelines || {};
        var vars = window.__hyperframes && window.__hyperframes.getVariables
          ? window.__hyperframes.getVariables() : {};
        var accent = /^#[0-9a-fA-F]{6}$/.test(String(vars.accent || ""))
          ? String(vars.accent) : "#c45c26";
        var title = typeof vars.title === "string" && vars.title ? vars.title : "Parchment Chart";
        var subtitle = typeof vars.subtitle === "string" && vars.subtitle ? vars.subtitle : "Educational cartography \u00b7 paper fold";

        document.getElementById("mpf-title").textContent = title;
        document.getElementById("mpf-subtitle").textContent = subtitle;
        document.getElementById("mpf-route").setAttribute("stroke", accent);
        var route = document.getElementById("mpf-route");
        var len = route.getTotalLength();
        gsap.set(route, { strokeDasharray: len, strokeDashoffset: len });
        gsap.set(["#mpf-land","#mpf-island","#mpf-title","#mpf-subtitle","#mpf-note","#mpf-crease"], { opacity: 0 });
        gsap.set("#mpf-frame", { scaleX: 0.08, transformOrigin: "50% 50%" });
        var tl = gsap.timeline({ paused: true });
        tl.to("#mpf-frame", { scaleX: 1, duration: 1.4, ease: "power2.out" }, 0);
        tl.to("#mpf-land", { opacity: 1, duration: 0.5 }, 1.0);
        tl.to("#mpf-island", { opacity: 1, duration: 0.4 }, 1.1);
        tl.to("#mpf-crease", { opacity: 1, duration: 0.4 }, 1.2);
        tl.to("#mpf-title", { opacity: 1, duration: 0.4 }, 1.3);
        tl.to("#mpf-subtitle", { opacity: 1, duration: 0.35 }, 1.5);
        tl.to(route, { strokeDashoffset: 0, duration: 2.8, ease: "power1.inOut" }, 2.0);
        tl.to("#mpf-note", { opacity: 1, duration: 0.4 }, 5.2);
        window.__timelines["map-parchment-fold"] = tl;

      })();
    </script>
  </body>
</html>
