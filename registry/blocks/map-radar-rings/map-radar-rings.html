    const HUBS = [{"x": 281, "y": 82, "label": "nyc", "p": "measured", "onset_t": 4.004, "r_max_px": 52, "expand_duration_s": 1.55}, {"x": 220, "y": 138, "label": "nashville_area", "p": "measured", "onset_t": 4.004, "r_max_px": 52, "expand_duration_s": 1.55}, {"x": 262, "y": 72, "label": "buffalo_area", "p": "measured", "onset_t": 4.071, "r_max_px": 52, "expand_duration_s": 1.55}, {"x": 221, "y": 94, "label": "chicago", "p": "measured", "onset_t": 4.137, "r_max_px": 52, "expand_duration_s": 1.55}, {"x": 242, "y": 98, "label": "pittsburgh", "p": "measured", "onset_t": 4.137, "r_max_px": 52, "expand_duration_s": 1.55}, {"x": 233, "y": 140, "label": "atlanta", "p": "measured", "onset_t": 4.137, "r_max_px": 52, "expand_duration_s": 1.55}, {"x": 198, "y": 72, "label": "milwaukee_area", "p": "measured", "onset_t": 4.271, "r_max_px": 52, "expand_duration_s": 1.55}, {"x": 53, "y": 50, "label": "seattle_area", "p": "measured", "onset_t": 4.45, "r_max_px": 52, "expand_duration_s": 1.55, "onset_note": "inferred timing"}, {"x": 35, "y": 132, "label": "california", "p": "measured", "onset_t": 4.671, "r_max_px": 52, "expand_duration_s": 1.55}, {"x": 167, "y": 103, "label": "kansas_city", "p": "measured", "onset_t": 4.671, "r_max_px": 52, "expand_duration_s": 1.55}, {"x": 109, "y": 101, "label": "denver", "p": "measured", "onset_t": 4.35, "r_max_px": 52, "expand_duration_s": 1.55, "onset_note": "coords measured; onset from prior series"}];
    const R_MAX_DEFAULT = 52;
    const EXPAND_DEFAULT = 1.55;
    const PULSE = 0.5;
    const RINGS_N = 3;
    const ringsLayer = document.getElementById('rings');
    function spawnRing(cx, cy, delay, rMax, expand) {
      const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      c.setAttribute('class', 'ring');
      c.setAttribute('cx', cx); c.setAttribute('cy', cy); c.setAttribute('r', 0);
      ringsLayer.appendChild(c);
      gsap.fromTo(c, { attr: { r: 0 }, opacity: 0.9 },
        { attr: { r: rMax }, opacity: 0, duration: expand, delay, ease: 'none',
          onComplete: () => c.remove() });
    }
    function pulseHub(hub) {
      const start = (hub.onset_t - 3.5);
      const rMax = hub.r_max_px || R_MAX_DEFAULT;
      const expand = hub.expand_duration_s || EXPAND_DEFAULT;
      for (let p = 0; p < 5; p++) {
        for (let i = 0; i < RINGS_N; i++) {
          const d = start + p * PULSE + i * 0.16;
          if (d > 3.75) continue; // stop spawning into iris
          spawnRing(hub.x, hub.y, d, rMax, expand);
        }
      }
    }
    const tl = gsap.timeline({ defaults: { ease: 'none' } });
    gsap.set('#map-layer', { opacity: 0 });
    tl.to('#map-layer', { opacity: 1, duration: 0.25 }, 0);
    HUBS.forEach(h => pulseHub(h));
    // Iris-out: shrink aperture toward NE (clip ~t=7.3 → rel 3.8); schematic gray outside
    tl.to('#iris-aperture', { attr: { r: 0 }, duration: 1.15, ease: 'power1.in' }, 3.8);
    window.__radarTimeline = tl;
    window.__timelines = window.__timelines || {};
    var vars = window.__hyperframes && window.__hyperframes.getVariables ? window.__hyperframes.getVariables() : {};
    if (typeof vars.credit === "string" && vars.credit) {
      var cel = document.getElementById("credit");
      if (cel) cel.textContent = vars.credit;
    }
    window.__timelines['map-radar-rings'] = tl;
    tl.pause(0);
  </script>
