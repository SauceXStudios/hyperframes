<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: #1a1714;
        overflow: hidden;
      }
      #root-map-shipping-lanes {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #1a1714;
        font-family: Georgia, "Times New Roman", serif;
      }
      #msl-frame {
        position: absolute;
        inset: 48px;
        border: 1px solid rgba(196, 181, 154, 0.14);
        background: #221e19;
      }
      #msl-svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      #msl-title {
        position: absolute;
        top: 72px;
        left: 96px;
        color: rgba(232, 220, 196, 0.92);
        font-size: 42px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        font-weight: 400;
      }
      #msl-subtitle {
        position: absolute;
        top: 128px;
        left: 96px;
        color: rgba(196, 181, 154, 0.55);
        font-size: 22px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }
      #msl-note {
        position: absolute;
        bottom: 88px;
        left: 96px;
        color: rgba(196, 181, 154, 0.55);
        font-size: 16px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        max-width: 900px;
      }
    </style>
  </head>
  <body>
    <div
      id="root-map-shipping-lanes"
      data-composition-id="map-shipping-lanes"
      data-start="0"
      data-duration="9"
      data-width="1920"
      data-height="1080"
    >
      <div id="msl-frame">
        <svg
          id="msl-svg"
          viewBox="0 0 1920 1080"
          xmlns="http://www.w3.org/2000/svg"
          aria-hidden="true"
        >
          <defs>
            <pattern
              id="msl-hatch"
              width="12"
              height="12"
              patternUnits="userSpaceOnUse"
              patternTransform="rotate(35)"
            >
              <line x1="0" y1="0" x2="0" y2="12" stroke="rgba(196,181,154,0.08)" stroke-width="1" />
            </pattern>
          </defs>

          <rect width="1920" height="1080" fill="#1f1b17" />
          <rect width="1920" height="1080" fill="url(#msl-hatch)" />
          <path
            id="msl-land"
            d="M 280 320 C 340 220 480 180 620 210 C 760 240 820 300 900 280 C 980 260 1080 300 1180 340 C 1280 380 1360 460 1380 560 C 1400 660 1340 760 1240 820 C 1140 880 980 900 860 860 C 740 820 700 780 620 800 C 540 820 420 780 360 700 C 300 620 240 500 280 320 Z"
            fill="rgba(196,181,154,0.16)"
            stroke="rgba(196,181,154,0.4)"
            stroke-width="2"
          />
          <path
            id="msl-island"
            d="M 1480 420 C 1540 400 1600 430 1610 480 C 1620 530 1580 570 1520 560 C 1460 550 1450 450 1480 420 Z"
            fill="rgba(196,181,154,0.12)"
            stroke="rgba(196,181,154,0.3)"
            stroke-width="1.5"
          />

          <path
            id="msl-lane1"
            d="M 400 640 C 560 700 780 720 980 680 C 1180 640 1380 600 1520 520"
            fill="none"
            stroke="#c45c26"
            stroke-width="3"
            stroke-linecap="round"
          />
          <path
            id="msl-lane2"
            d="M 440 580 C 640 540 860 500 1080 520 C 1280 540 1420 480 1560 440"
            fill="none"
            stroke="#c45c26"
            stroke-width="2.5"
            stroke-linecap="round"
            opacity="0.7"
          />
          <circle id="msl-pa" cx="400" cy="640" r="10" fill="#c45c26" />
          <circle id="msl-pb" cx="1520" cy="520" r="10" fill="#c45c26" />
          <text
            id="msl-from"
            x="400"
            y="680"
            text-anchor="middle"
            fill="rgba(232,220,196,0.85)"
            font-size="18"
            font-family="Georgia, serif"
          >
            PORT A
          </text>
          <text
            id="msl-to"
            x="1520"
            y="560"
            text-anchor="middle"
            fill="rgba(232,220,196,0.85)"
            font-size="18"
            font-family="Georgia, serif"
          >
            PORT B
          </text>
        </svg>
      </div>
      <div id="msl-title" data-var-text="title">Sea Lanes</div>
      <div id="msl-subtitle" data-var-text="subtitle">Educational cartography · shipping lanes</div>
      <div id="msl-note">Dotted sea lanes · schematic ports only</div>
    </div>
    <script>
      (function () {
        window.__timelines = window.__timelines || {};
        var vars =
          window.__hyperframes && window.__hyperframes.getVariables
            ? window.__hyperframes.getVariables()
            : {};
        var accent = /^#[0-9a-fA-F]{6}$/.test(String(vars.accent || ""))
          ? String(vars.accent)
          : "#c45c26";
        var title = typeof vars.title === "string" && vars.title ? vars.title : "Sea Lanes";
        var subtitle =
          typeof vars.subtitle === "string" && vars.subtitle
            ? vars.subtitle
            : "Educational cartography \u00b7 shipping lanes";
        var fromLabel =
          typeof vars.fromLabel === "string" && vars.fromLabel ? vars.fromLabel : "PORT A";
        var toLabel = typeof vars.toLabel === "string" && vars.toLabel ? vars.toLabel : "PORT B";

        document.getElementById("msl-title").textContent = title;
        document.getElementById("msl-subtitle").textContent = subtitle;
        document.getElementById("msl-from").textContent = fromLabel;
        document.getElementById("msl-to").textContent = toLabel;
        ["msl-lane1", "msl-lane2"].forEach(function (id) {
          document.getElementById(id).setAttribute("stroke", accent);
        });
        document.getElementById("msl-pa").setAttribute("fill", accent);
        document.getElementById("msl-pb").setAttribute("fill", accent);
        var l1 = document.getElementById("msl-lane1");
        var l2 = document.getElementById("msl-lane2");
        var len1 = l1.getTotalLength(),
          len2 = l2.getTotalLength();
        gsap.set(l1, { strokeDasharray: "3 14", strokeDashoffset: len1 });
        gsap.set(l2, { strokeDasharray: "3 14", strokeDashoffset: len2 });
        gsap.set(
          [
            "#msl-land",
            "#msl-island",
            "#msl-from",
            "#msl-to",
            "#msl-pa",
            "#msl-pb",
            "#msl-title",
            "#msl-subtitle",
            "#msl-note",
          ],
          { opacity: 0 },
        );
        var tl = gsap.timeline({ paused: true });
        tl.to("#msl-land", { opacity: 1, duration: 0.5 }, 0);
        tl.to("#msl-island", { opacity: 1, duration: 0.4 }, 0.1);
        tl.to("#msl-title", { opacity: 1, duration: 0.4 }, 0.15);
        tl.to("#msl-subtitle", { opacity: 1, duration: 0.35 }, 0.35);
        tl.to(["#msl-pa", "#msl-from"], { opacity: 1, duration: 0.35 }, 0.7);
        tl.to(l1, { strokeDashoffset: 0, duration: 3.5, ease: "power1.inOut" }, 1.1);
        tl.to(l2, { strokeDashoffset: 0, duration: 3.2, ease: "power1.inOut" }, 1.6);
        tl.to(["#msl-pb", "#msl-to"], { opacity: 1, duration: 0.35 }, 4.4);
        tl.to("#msl-note", { opacity: 1, duration: 0.4 }, 5.5);
        window.__timelines["map-shipping-lanes"] = tl;
      })();
    </script>
  </body>
</html>
