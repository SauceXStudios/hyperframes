<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: #1a1714;
        overflow: hidden;
      }
      #root-map-split-theater {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #1a1714;
        font-family: Georgia, "Times New Roman", serif;
      }
      #msx-frame {
        position: absolute;
        inset: 48px;
        border: 1px solid rgba(196, 181, 154, 0.14);
        background: #221e19;
      }
      #msx-svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      #msx-title {
        position: absolute;
        top: 72px;
        left: 96px;
        color: rgba(232, 220, 196, 0.92);
        font-size: 42px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        font-weight: 400;
      }
      #msx-subtitle {
        position: absolute;
        top: 128px;
        left: 96px;
        color: rgba(196, 181, 154, 0.55);
        font-size: 22px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }
      #msx-note {
        position: absolute;
        bottom: 88px;
        left: 96px;
        color: rgba(196, 181, 154, 0.55);
        font-size: 16px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        max-width: 900px;
      }
    </style>
  </head>
  <body>
    <div
      id="root-map-split-theater"
      data-composition-id="map-split-theater"
      data-start="0"
      data-duration="8"
      data-width="1920"
      data-height="1080"
    >
      <div id="msx-frame">
        <svg
          id="msx-svg"
          viewBox="0 0 1920 1080"
          xmlns="http://www.w3.org/2000/svg"
          aria-hidden="true"
        >
          <defs>
            <pattern
              id="msx-hatch"
              width="12"
              height="12"
              patternUnits="userSpaceOnUse"
              patternTransform="rotate(35)"
            >
              <line x1="0" y1="0" x2="0" y2="12" stroke="rgba(196,181,154,0.08)" stroke-width="1" />
            </pattern>
          </defs>

          <rect width="1920" height="1080" fill="#1f1b17" />
          <rect width="1920" height="1080" fill="url(#msx-hatch)" />
          <clipPath id="msx-clip-l"><rect x="0" y="0" width="960" height="1080" /></clipPath>
          <clipPath id="msx-clip-r"><rect x="960" y="0" width="960" height="1080" /></clipPath>
          <g id="msx-left" clip-path="url(#msx-clip-l)">
            <path
              id="msx-land-l"
              d="M 280 320 C 340 220 480 180 620 210 C 760 240 820 300 900 280 C 980 260 1080 300 1180 340 C 1280 380 1360 460 1380 560 C 1400 660 1340 760 1240 820 C 1140 880 980 900 860 860 C 740 820 700 780 620 800 C 540 820 420 780 360 700 C 300 620 240 500 280 320 Z"
              fill="rgba(196,181,154,0.16)"
              stroke="rgba(196,181,154,0.4)"
              stroke-width="2"
              transform="translate(-200 0) scale(0.85)"
            />
            <path
              id="msx-a1"
              d="M 280 600 L 520 480"
              fill="none"
              stroke="#c45c26"
              stroke-width="4"
              stroke-linecap="round"
            />
          </g>
          <g id="msx-right" clip-path="url(#msx-clip-r)">
            <path
              id="msx-land-r"
              d="M 280 320 C 340 220 480 180 620 210 C 760 240 820 300 900 280 C 980 260 1080 300 1180 340 C 1280 380 1360 460 1380 560 C 1400 660 1340 760 1240 820 C 1140 880 980 900 860 860 C 740 820 700 780 620 800 C 540 820 420 780 360 700 C 300 620 240 500 280 320 Z"
              fill="rgba(196,181,154,0.16)"
              stroke="rgba(196,181,154,0.4)"
              stroke-width="2"
              transform="translate(420 40) scale(0.85)"
            />
            <path
              id="msx-a2"
              d="M 1280 520 L 1520 640"
              fill="none"
              stroke="#c45c26"
              stroke-width="4"
              stroke-linecap="round"
            />
          </g>
          <line
            id="msx-divider"
            x1="960"
            y1="120"
            x2="960"
            y2="960"
            stroke="rgba(196,181,154,0.35)"
            stroke-width="2"
          />
          <text
            id="msx-lt"
            x="480"
            y="200"
            text-anchor="middle"
            fill="rgba(232,220,196,0.8)"
            font-size="28"
            font-family="Georgia, serif"
            letter-spacing="0.2em"
          >
            WEST
          </text>
          <text
            id="msx-rt"
            x="1440"
            y="200"
            text-anchor="middle"
            fill="rgba(232,220,196,0.8)"
            font-size="28"
            font-family="Georgia, serif"
            letter-spacing="0.2em"
          >
            EAST
          </text>
        </svg>
      </div>
      <div id="msx-title" data-var-text="title">Two Theaters</div>
      <div id="msx-subtitle" data-var-text="subtitle">Educational cartography · split screen</div>
      <div id="msx-note">Split-screen theaters · abstract dual campaigns</div>
    </div>
    <script>
      (function () {
        window.__timelines = window.__timelines || {};
        var vars =
          window.__hyperframes && window.__hyperframes.getVariables
            ? window.__hyperframes.getVariables()
            : {};
        var accent = /^#[0-9a-fA-F]{6}$/.test(String(vars.accent || ""))
          ? String(vars.accent)
          : "#c45c26";
        var title = typeof vars.title === "string" && vars.title ? vars.title : "Two Theaters";
        var subtitle =
          typeof vars.subtitle === "string" && vars.subtitle
            ? vars.subtitle
            : "Educational cartography \u00b7 split screen";
        var leftTitle =
          typeof vars.leftTitle === "string" && vars.leftTitle ? vars.leftTitle : "WEST";
        var rightTitle =
          typeof vars.rightTitle === "string" && vars.rightTitle ? vars.rightTitle : "EAST";

        document.getElementById("msx-title").textContent = title;
        document.getElementById("msx-subtitle").textContent = subtitle;
        document.getElementById("msx-lt").textContent = leftTitle;
        document.getElementById("msx-rt").textContent = rightTitle;
        document.getElementById("msx-a1").setAttribute("stroke", accent);
        document.getElementById("msx-a2").setAttribute("stroke", accent);
        var a1 = document.getElementById("msx-a1");
        var a2 = document.getElementById("msx-a2");
        var len1 = a1.getTotalLength(),
          len2 = a2.getTotalLength();
        gsap.set(a1, { strokeDasharray: len1, strokeDashoffset: len1 });
        gsap.set(a2, { strokeDasharray: len2, strokeDashoffset: len2 });
        gsap.set(
          [
            "#msx-left",
            "#msx-right",
            "#msx-divider",
            "#msx-lt",
            "#msx-rt",
            "#msx-title",
            "#msx-subtitle",
            "#msx-note",
          ],
          { opacity: 0 },
        );
        var tl = gsap.timeline({ paused: true });
        tl.to("#msx-title", { opacity: 1, duration: 0.4 }, 0.1);
        tl.to("#msx-subtitle", { opacity: 1, duration: 0.35 }, 0.3);
        tl.to("#msx-divider", { opacity: 1, duration: 0.4 }, 0.5);
        tl.to("#msx-left", { opacity: 1, duration: 0.5 }, 0.7);
        tl.to("#msx-lt", { opacity: 1, duration: 0.35 }, 0.9);
        tl.to("#msx-right", { opacity: 1, duration: 0.5 }, 1.2);
        tl.to("#msx-rt", { opacity: 1, duration: 0.35 }, 1.4);
        tl.to(a1, { strokeDashoffset: 0, duration: 1.8, ease: "power1.inOut" }, 2.0);
        tl.to(a2, { strokeDashoffset: 0, duration: 1.8, ease: "power1.inOut" }, 2.4);
        tl.to("#msx-note", { opacity: 1, duration: 0.4 }, 5.0);
        window.__timelines["map-split-theater"] = tl;
      })();
    </script>
  </body>
</html>
