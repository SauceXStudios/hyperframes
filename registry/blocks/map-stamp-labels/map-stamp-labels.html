<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: #1a1714;
        overflow: hidden;
      }
      #root-map-stamp-labels {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #1a1714;
        font-family: Georgia, "Times New Roman", serif;
      }
      #mst-frame {
        position: absolute;
        inset: 48px;
        border: 1px solid rgba(196, 181, 154, 0.14);
        background: #221e19;
      }
      #mst-svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      #mst-title {
        position: absolute;
        top: 72px;
        left: 96px;
        color: rgba(232, 220, 196, 0.92);
        font-size: 42px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        font-weight: 400;
      }
      #mst-subtitle {
        position: absolute;
        top: 128px;
        left: 96px;
        color: rgba(196, 181, 154, 0.55);
        font-size: 22px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }
      #mst-note {
        position: absolute;
        bottom: 88px;
        left: 96px;
        color: rgba(196, 181, 154, 0.55);
        font-size: 16px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        max-width: 900px;
      }
    </style>
  </head>
  <body>
    <div
      id="root-map-stamp-labels"
      data-composition-id="map-stamp-labels"
      data-start="0"
      data-duration="8"
      data-width="1920"
      data-height="1080"
    >
      <div id="mst-frame">
        <svg
          id="mst-svg"
          viewBox="0 0 1920 1080"
          xmlns="http://www.w3.org/2000/svg"
          aria-hidden="true"
        >
          <defs>
            <pattern
              id="mst-hatch"
              width="12"
              height="12"
              patternUnits="userSpaceOnUse"
              patternTransform="rotate(35)"
            >
              <line x1="0" y1="0" x2="0" y2="12" stroke="rgba(196,181,154,0.08)" stroke-width="1" />
            </pattern>
          </defs>

          <rect width="1920" height="1080" fill="#1f1b17" />
          <rect width="1920" height="1080" fill="url(#mst-hatch)" />
          <path
            id="mst-land"
            d="M 280 320 C 340 220 480 180 620 210 C 760 240 820 300 900 280 C 980 260 1080 300 1180 340 C 1280 380 1360 460 1380 560 C 1400 660 1340 760 1240 820 C 1140 880 980 900 860 860 C 740 820 700 780 620 800 C 540 820 420 780 360 700 C 300 620 240 500 280 320 Z"
            fill="rgba(196,181,154,0.16)"
            stroke="rgba(196,181,154,0.4)"
            stroke-width="2"
          />
          <path
            id="mst-island"
            d="M 1480 420 C 1540 400 1600 430 1610 480 C 1620 530 1580 570 1520 560 C 1460 550 1450 450 1480 420 Z"
            fill="rgba(196,181,154,0.12)"
            stroke="rgba(196,181,154,0.3)"
            stroke-width="1.5"
          />

          <g id="mst-stamp1">
            <rect
              x="450"
              y="452"
              width="140"
              height="56"
              fill="none"
              stroke="#c45c26"
              stroke-width="3"
              rx="2"
            />
            <text
              id="mst-t1"
              x="520"
              y="488"
              text-anchor="middle"
              fill="#c45c26"
              font-size="26"
              font-family="Georgia, serif"
              letter-spacing="0.18em"
            >
              HAVEN
            </text>
          </g>
          <g id="mst-stamp2">
            <rect
              x="830"
              y="372"
              width="140"
              height="56"
              fill="none"
              stroke="#c45c26"
              stroke-width="3"
              rx="2"
            />
            <text
              id="mst-t2"
              x="900"
              y="408"
              text-anchor="middle"
              fill="#c45c26"
              font-size="26"
              font-family="Georgia, serif"
              letter-spacing="0.18em"
            >
              RIDGE
            </text>
          </g>
          <g id="mst-stamp3">
            <rect
              x="1110"
              y="592"
              width="140"
              height="56"
              fill="none"
              stroke="#c45c26"
              stroke-width="3"
              rx="2"
            />
            <text
              id="mst-t3"
              x="1180"
              y="628"
              text-anchor="middle"
              fill="#c45c26"
              font-size="26"
              font-family="Georgia, serif"
              letter-spacing="0.18em"
            >
              FORD
            </text>
          </g>
        </svg>
      </div>
      <div id="mst-title" data-var-text="title">Stamped Places</div>
      <div id="mst-subtitle" data-var-text="subtitle">Educational cartography · stamp labels</div>
      <div id="mst-note">Stamp slam · typewriter place marks</div>
    </div>
    <script>
      (function () {
        window.__timelines = window.__timelines || {};
        var vars =
          window.__hyperframes && window.__hyperframes.getVariables
            ? window.__hyperframes.getVariables()
            : {};
        var accent = /^#[0-9a-fA-F]{6}$/.test(String(vars.accent || ""))
          ? String(vars.accent)
          : "#c45c26";
        var title = typeof vars.title === "string" && vars.title ? vars.title : "Stamped Places";
        var subtitle =
          typeof vars.subtitle === "string" && vars.subtitle
            ? vars.subtitle
            : "Educational cartography \u00b7 stamp labels";
        var labelA = typeof vars.labelA === "string" && vars.labelA ? vars.labelA : "HAVEN";
        var labelB = typeof vars.labelB === "string" && vars.labelB ? vars.labelB : "RIDGE";
        var labelC = typeof vars.labelC === "string" && vars.labelC ? vars.labelC : "FORD";

        document.getElementById("mst-title").textContent = title;
        document.getElementById("mst-subtitle").textContent = subtitle;
        document.getElementById("mst-t1").textContent = labelA;
        document.getElementById("mst-t2").textContent = labelB;
        document.getElementById("mst-t3").textContent = labelC;
        ["mst-stamp1", "mst-stamp2", "mst-stamp3"].forEach(function (id) {
          var g = document.getElementById(id);
          g.querySelector("rect").setAttribute("stroke", accent);
          g.querySelector("text").setAttribute("fill", accent);
        });
        gsap.set(["#mst-land", "#mst-island", "#mst-title", "#mst-subtitle", "#mst-note"], {
          opacity: 0,
        });
        gsap.set(["#mst-stamp1", "#mst-stamp2", "#mst-stamp3"], {
          opacity: 0,
          scale: 1.55,
          rotation: -8,
          transformOrigin: "50% 50%",
        });
        var tl = gsap.timeline({ paused: true });
        tl.to("#mst-land", { opacity: 1, duration: 0.5 }, 0);
        tl.to("#mst-island", { opacity: 1, duration: 0.4 }, 0.1);
        tl.to("#mst-title", { opacity: 1, duration: 0.4 }, 0.15);
        tl.to("#mst-subtitle", { opacity: 1, duration: 0.35 }, 0.35);
        tl.to(
          "#mst-stamp1",
          { opacity: 1, scale: 1, rotation: -3, duration: 0.35, ease: "power3.in" },
          1.0,
        );
        tl.to(
          "#mst-stamp2",
          { opacity: 1, scale: 1, rotation: 2, duration: 0.35, ease: "power3.in" },
          2.0,
        );
        tl.to(
          "#mst-stamp3",
          { opacity: 1, scale: 1, rotation: -2, duration: 0.35, ease: "power3.in" },
          3.0,
        );
        tl.to("#mst-note", { opacity: 1, duration: 0.4 }, 4.5);
        window.__timelines["map-stamp-labels"] = tl;
      })();
    </script>
  </body>
</html>
