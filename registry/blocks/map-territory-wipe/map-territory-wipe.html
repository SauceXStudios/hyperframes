        function hwAt(s, W) {
          var hs = W.headStart;
          if (s < hs) {
            var u = s / hs;
            return Math.max(6, W.w0 + (W.wMid - W.w0) * Math.sin(u * Math.PI * 0.85) + (W.wTip - W.w0) * u * 0.12) / 2;
          }
          var u = (s - hs) / (1 - hs);
          var barb = (W.wMid * W.headBarb) / 2;
          var tipW = 1.5;
          if (u < 0.32) return hwLerp(W.wTip * 0.55, barb, u / 0.32);
          return hwLerp(barb, tipW, (u - 0.32) / 0.68);
        }
        function hwLerp(a, b, t) { return a + (b - a) * t; }

        function ribbonD(key, progress) {
          var rd = RIB[key];
          var W = RIB.widths[key];
          var pts = rd.pts, tans = rd.tans;
          var n = pts.length;
          var count = Math.max(2, Math.floor(1 + progress * (n - 1)));
          var left = [], right = [];
          for (var i = 0; i < count; i++) {
            var s = i / (count - 1);
            // map s onto sampled span so width profile tracks true arc fraction
            var si = (count - 1) / (n - 1);
            var sFull = (i / (n - 1));
            var hw = hwAt(sFull, W);
            var x = pts[i][0], y = pts[i][1];
            var tx = tans[i][0], ty = tans[i][1];
            var nx = -ty, ny = tx;
            left.push([x + nx * hw, y + ny * hw]);
            right.push([x - nx * hw, y - ny * hw]);
          }
          var last = pts[count - 1];
          var lt = tans[count - 1];
          var tip = [last[0] + lt[0] * 8, last[1] + lt[1] * 8];
          var d = "M " + left[0][0].toFixed(1) + " " + left[0][1].toFixed(1);
          for (var i = 1; i < left.length; i++) d += " L " + left[i][0].toFixed(1) + " " + left[i][1].toFixed(1);
          d += " L " + tip[0].toFixed(1) + " " + tip[1].toFixed(1);
          for (var i = right.length - 1; i >= 0; i--) d += " L " + right[i][0].toFixed(1) + " " + right[i][1].toFixed(1);
          d += " Z";
          return d;
        }
