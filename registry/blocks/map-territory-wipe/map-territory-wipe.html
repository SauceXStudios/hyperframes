<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: #0a0a0a;
        overflow: hidden;
      }
      #root-map-territory-wipe {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #0a0a0a;
        font-family: "Helvetica Neue", Helvetica, sans-serif;
      }
      #tw-video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        background: #000;
      }
      #tw-frame {
        position: absolute;
        inset: 36px;
        border: 1px solid rgba(232, 220, 196, 0.28);
        pointer-events: none;
      }
      #tw-title {
        position: absolute;
        left: 72px;
        top: 56px;
        max-width: 1400px;
        color: rgba(245, 236, 214, 0.95);
        font-size: 36px;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        text-shadow: 0 2px 12px rgba(0, 0, 0, 0.75);
      }
      #tw-credit {
        position: absolute;
        left: 72px;
        right: 72px;
        bottom: 56px;
        color: rgba(232, 220, 196, 0.88);
        font-size: 18px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
      }
      #tw-credit-url {
        display: block;
        margin-top: 8px;
        font-size: 14px;
        letter-spacing: 0.04em;
        text-transform: none;
        color: rgba(196, 181, 154, 0.7);
      }
    </style>
  </head>
  <body>
    <div
      id="root-map-territory-wipe"
      data-composition-id="map-territory-wipe"
      data-start="0"
      data-duration="12.01"
      data-width="1920"
      data-height="1080"
    >
      <video
        id="tw-video"
        src="assets/clip.mp4"
        muted
        playsinline
        preload="auto"
        data-start="0"
        data-duration="12.01"
        data-media-start="0"
      ></video>
      <div id="tw-frame" aria-hidden="true"></div>
      <div id="tw-title" data-var-text="title">Archival Map - Territory Wipe</div>
      <div id="tw-credit">
        <span data-var-text="credit"
          >Footage: Moving Image Archive | Frontiers of the Future (A Screen Editorial With Lowell
          Thomas)</span
        >
        <span id="tw-credit-url"
          >movingimagearchive.com/collection/animated-maps - public domain / free to reuse</span
        >
      </div>
    </div>
    <script>
      (function () {
        window.__timelines = window.__timelines || {};

        var vars =
          window.__hyperframes && window.__hyperframes.getVariables
            ? window.__hyperframes.getVariables()
            : {};

        var title =
          typeof vars.title === "string" && vars.title
            ? vars.title
            : "Archival Map - Territory Wipe";
        var credit =
          typeof vars.credit === "string" && vars.credit
            ? vars.credit
            : "Footage: Moving Image Archive | Frontiers of the Future (A Screen Editorial With Lowell Thomas)";

        document.getElementById("tw-title").textContent = title;
        document.querySelector('#tw-credit [data-var-text="credit"]').textContent = credit;

        var tl = gsap.timeline({ paused: true });
        // Credit/title hold - HyperFrames media runtime seeks the video via data-start
        tl.fromTo(
          "#tw-title",
          { opacity: 0 },
          { opacity: 1, duration: 0.6, ease: "power1.out" },
          0,
        );
        tl.fromTo(
          "#tw-credit",
          { opacity: 0 },
          { opacity: 1, duration: 0.6, ease: "power1.out" },
          0.15,
        );
        tl.to({}, { duration: Math.max(0.01, 12.01 - 0.75) });

        window.__timelines["map-territory-wipe"] = tl;
      })();
    </script>
  </body>
</html>
